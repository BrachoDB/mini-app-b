<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4ef">
    <title>Trivia | Cultura general</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17231f;
        --muted: #64736c;
        --paper: #f5f4ef;
        --card: #fffefa;
        --green: #176b51;
        --green-dark: #10513e;
        --lime: #d7ed9c;
        --line: #e4e6dc;
        --red: #a63d35;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 10% 5%, #e5efd4 0, transparent 31rem),
          var(--paper);
      }

      button { font: inherit; }

      .shell {
        width: min(100% - 2rem, 940px);
        margin: 0 auto;
        padding: 2rem 0 3rem;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 3.5rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: .7rem;
        font-size: .95rem;
        font-weight: 800;
        letter-spacing: -.03em;
      }

      .brand-mark {
        display: grid;
        width: 2.4rem;
        aspect-ratio: 1;
        place-items: center;
        border-radius: .8rem;
        color: var(--green-dark);
        background: var(--lime);
        font-size: 1.25rem;
      }

      .top-note {
        color: var(--muted);
        font-size: .85rem;
      }

      main { max-width: 760px; margin: 0 auto; }

      .eyebrow {
        margin: 0 0 .8rem;
        color: var(--green);
        font-size: .76rem;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 680px;
        margin: 0;
        font-size: clamp(2.6rem, 8vw, 5rem);
        line-height: .98;
        letter-spacing: -.075em;
      }

      .intro {
        max-width: 500px;
        margin: 1.2rem 0 2rem;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.65;
      }

      .quiz-card {
        padding: clamp(1.25rem, 5vw, 2.5rem);
        border: 1px solid #e8e8de;
        border-radius: 1.5rem;
        background: var(--card);
        box-shadow: 0 24px 70px #283b2810, 0 2px 8px #283b2808;
      }

      .section-label {
        display: block;
        margin-bottom: .85rem;
        font-size: .9rem;
        font-weight: 750;
      }

      .categories {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: .65rem;
      }

      .category-button, .option-button {
        min-height: 3.2rem;
        border: 1px solid var(--line);
        border-radius: .9rem;
        color: var(--ink);
        background: #fff;
        cursor: pointer;
        transition: border-color .16s ease, background .16s ease, transform .16s ease;
      }

      .category-button { padding: .7rem .45rem; font-size: .88rem; font-weight: 700; }
      .category-button:hover, .option-button:hover { border-color: var(--green); transform: translateY(-1px); }
      .category-button[aria-pressed="true"] { border-color: var(--green); color: var(--green-dark); background: #eff6e7; }

      .quantity-select {
        min-height: 3rem;
        padding: .6rem .8rem;
        border: 1px solid var(--line);
        border-radius: .8rem;
        color: var(--ink);
        background: #fff;
        font: inherit;
      }

      .primary-button {
        display: inline-flex;
        min-height: 3.35rem;
        align-items: center;
        justify-content: center;
        gap: .6rem;
        margin-top: 1.3rem;
        padding: .8rem 1.2rem;
        border: 0;
        border-radius: .9rem;
        color: white;
        background: var(--green);
        font-weight: 750;
        cursor: pointer;
        transition: background .16s ease, transform .16s ease;
      }

      .primary-button:hover { background: var(--green-dark); transform: translateY(-1px); }
      .primary-button:disabled { opacity: .55; cursor: not-allowed; transform: none; }

      .error {
        min-height: 1.4rem;
        margin: .8rem 0 0;
        color: var(--red);
        font-size: .9rem;
      }

      .question-area[hidden], .setup-area[hidden], .result-area[hidden] { display: none; }
      .question-top { display: flex; justify-content: space-between; gap: 1rem; color: var(--muted); font-size: .88rem; }
      .progress-track { height: .45rem; margin: 1rem 0 1.8rem; overflow: hidden; border-radius: 99px; background: #e9eee4; }
      .progress-value { width: 0; height: 100%; border-radius: inherit; background: var(--green); transition: width .25s ease; }
      h2 { margin: 0 0 1.4rem; font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1.25; letter-spacing: -.04em; }
      .options { display: grid; gap: .7rem; }
      .option-button { display: flex; align-items: center; gap: .8rem; padding: .85rem 1rem; text-align: left; }
      .option-letter { display: grid; width: 1.8rem; aspect-ratio: 1; flex: 0 0 auto; place-items: center; border-radius: .55rem; background: #f1f2eb; font-size: .82rem; font-weight: 800; }
      .option-button:disabled { cursor: default; transform: none; }
      .option-button.is-correct { border-color: #9dc77c; background: #f0f7e9; }
      .option-button.is-wrong { border-color: #e3aaa5; background: #fff3f1; }
      .feedback { margin: 1rem 0 0; color: var(--muted); line-height: 1.6; }
      .feedback strong { color: var(--green-dark); }
      .result-area { text-align: center; }
      .result-score { margin: .25rem 0 .65rem; color: var(--green); font-size: clamp(3rem, 12vw, 5rem); font-weight: 850; letter-spacing: -.08em; }
      .result-area h2 { margin-bottom: .4rem; }
      .result-copy { color: var(--muted); }
      .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }

      @media (max-width: 580px) {
        header { margin-bottom: 2.5rem; }
        .top-note { display: none; }
        .categories { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .category-button { min-height: 3rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand"><span class="brand-mark" aria-hidden="true">?</span> Trivialia</div>
        <span class="top-note">Un buen dato cambia la conversación.</span>
      </header>

      <main>
        <p class="eyebrow">Un reto para tu curiosidad</p>
        <h1>¿Cuánto sabes<br>del mundo?</h1>
        <p class="intro">Elige un tema, responde a tu ritmo y descubre cuánto sabes de cultura general.</p>

        <section class="quiz-card" aria-label="Trivia de cultura general">
          <div class="setup-area" id="setup-area">
            <span class="section-label">Escoge una categoría</span>
            <div class="categories" id="categories" role="group" aria-label="Categorías"></div>
            <label class="section-label" for="question-quantity">Cantidad de preguntas</label>
            <select class="quantity-select" id="question-quantity">
              <option value="1">1 pregunta</option>
              <option value="2">2 preguntas</option>
              <option value="3" selected>3 preguntas</option>
              <option value="4">4 preguntas</option>
              <option value="5">5 preguntas</option>
            </select>
            <button class="primary-button" id="start-button" type="button">Comenzar trivia <span aria-hidden="true">→</span></button>
            <p class="error" id="setup-error" role="alert"></p>
          </div>

          <div class="question-area" id="question-area" hidden>
            <div class="question-top">
              <span id="category-name"></span>
              <span id="question-count"></span>
            </div>
            <div class="progress-track" aria-hidden="true"><div class="progress-value" id="progress-value"></div></div>
            <h2 id="question-text"></h2>
            <div class="options" id="options"></div>
            <p class="feedback" id="feedback" aria-live="polite"></p>
            <button class="primary-button" id="next-button" type="button" hidden>Continuar <span aria-hidden="true">→</span></button>
          </div>

          <div class="result-area" id="result-area" hidden>
            <p class="eyebrow">Trivia completada</p>
            <p class="result-score" id="result-score"></p>
            <h2 id="result-title">¡Buen trabajo!</h2>
            <p class="result-copy" id="result-copy"></p>
            <button class="primary-button" id="restart-button" type="button">Jugar otra vez <span aria-hidden="true">↻</span></button>
          </div>
        </section>
      </main>
    </div>

    <script>
      const categoriesElement = document.querySelector("#categories");
      const setupArea = document.querySelector("#setup-area");
      const questionArea = document.querySelector("#question-area");
      const resultArea = document.querySelector("#result-area");
      const startButton = document.querySelector("#start-button");
      const questionQuantity = document.querySelector("#question-quantity");
      const nextButton = document.querySelector("#next-button");
      const setupError = document.querySelector("#setup-error");
      const optionLetters = ["A", "B", "C", "D"];
      let selectedCategory = null;
      let quiz = null;
      let currentQuestion = null;
      let lastAnswer = null;

      async function request(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: { "Content-Type": "application/json", ...options.headers },
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Ocurrió un error. Intenta de nuevo.");
        }
        return data;
      }

      function showSetupError(message) {
        setupError.textContent = message;
      }

      async function loadCategories() {
        try {
          const categories = await request("/api/categories");
          categories.forEach((category) => {
            const button = document.createElement("button");
            button.className = "category-button";
            button.type = "button";
            button.textContent = category.name;
            button.setAttribute("aria-pressed", "false");
            button.addEventListener("click", () => {
              selectedCategory = category.id;
              showSetupError("");
              categoriesElement.querySelectorAll("button").forEach((item) => {
                item.setAttribute("aria-pressed", String(item === button));
              });
            });
            categoriesElement.append(button);
          });
        } catch (error) {
          showSetupError(error.message);
          startButton.disabled = true;
        }
      }

      function displayQuestion(question, answered) {
        currentQuestion = question;
        lastAnswer = null;
        questionArea.hidden = false;
        resultArea.hidden = true;
        document.querySelector("#category-name").textContent = quiz.category;
        document.querySelector("#question-count").textContent =
          `Pregunta ${answered + 1} de ${quiz.total_questions}`;
        document.querySelector("#progress-value").style.width =
          `${(answered / quiz.total_questions) * 100}%`;
        document.querySelector("#question-text").textContent = question.question;
        document.querySelector("#feedback").textContent = "";
        nextButton.hidden = true;
        const options = document.querySelector("#options");
        options.replaceChildren();

        question.options.forEach((option, index) => {
          const button = document.createElement("button");
          button.className = "option-button";
          button.type = "button";
          const letter = document.createElement("span");
          letter.className = "option-letter";
          letter.textContent = optionLetters[index];
          const label = document.createElement("span");
          label.textContent = option;
          button.append(letter, label);
          button.addEventListener("click", () => sendAnswer(index));
          options.append(button);
        });
      }

      async function sendAnswer(selectedOption) {
        document.querySelectorAll(".option-button").forEach((button) => {
          button.disabled = true;
        });
        try {
          lastAnswer = await request(`/api/quizzes/${quiz.quiz_id}/answers`, {
            method: "POST",
            body: JSON.stringify({
              question_id: currentQuestion.id,
              selected_option: selectedOption,
            }),
          });
          const optionButtons = [...document.querySelectorAll(".option-button")];
          optionButtons[lastAnswer.correct_option].classList.add("is-correct");
          if (!lastAnswer.correct) {
            optionButtons[selectedOption].classList.add("is-wrong");
          }
          const feedback = document.querySelector("#feedback");
          feedback.innerHTML = lastAnswer.correct
            ? "<strong>¡Correcto!</strong> "
            : "<strong>No era esa.</strong> ";
          feedback.append(document.createTextNode(lastAnswer.explanation));

          if (lastAnswer.completed) {
            nextButton.textContent = "Ver resultado →";
          } else {
            nextButton.innerHTML = 'Siguiente pregunta <span aria-hidden="true">→</span>';
          }
          nextButton.hidden = false;
          nextButton.focus();
        } catch (error) {
          document.querySelector("#feedback").textContent = error.message;
          document.querySelectorAll(".option-button").forEach((button) => {
            button.disabled = false;
          });
        }
      }

      function showResult() {
        questionArea.hidden = true;
        resultArea.hidden = false;
        document.querySelector("#progress-value").style.width = "100%";
        document.querySelector("#result-score").textContent =
          `${lastAnswer.score}/${quiz.total_questions}`;
        document.querySelector("#result-copy").textContent =
          `Respondiste correctamente ${lastAnswer.score} de ${quiz.total_questions} preguntas de ${quiz.category}.`;
        document.querySelector("#result-title").textContent =
          lastAnswer.score === quiz.total_questions ? "¡Impecable!" : "¡Gracias por jugar!";
      }

      startButton.addEventListener("click", async () => {
        if (!selectedCategory) {
          showSetupError("Selecciona una categoría para comenzar.");
          return;
        }
        startButton.disabled = true;
        showSetupError("");
        try {
          quiz = await request("/api/quizzes", {
            method: "POST",
            body: JSON.stringify({
              category: selectedCategory,
              cantidad: Number(questionQuantity.value),
            }),
          });
          setupArea.hidden = true;
          displayQuestion(quiz.question, 0);
        } catch (error) {
          showSetupError(error.message);
        } finally {
          startButton.disabled = false;
        }
      });

      nextButton.addEventListener("click", () => {
        if (lastAnswer.completed) {
          showResult();
          return;
        }
        displayQuestion(lastAnswer.next_question, lastAnswer.answered);
      });

      document.querySelector("#restart-button").addEventListener("click", () => {
        resultArea.hidden = true;
        setupArea.hidden = false;
        questionArea.hidden = true;
      });

      loadCategories();
    </script>
  </body>
</html>
